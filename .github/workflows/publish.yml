name: Publicar sitio

on:
  push:
    branches: [main]
  # En los pull requests corre solo el build (el deploy se salta, ver el
  # `if` de abajo): la palomita o la cruz del render aparecen en el PR
  # antes del merge, así que un cambio que rompe el sitio se ve venir.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un grupo por ref: los deploys de main se serializan entre sí (nunca dos
# a la vez), y los builds de cada PR no hacen fila detrás de un deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Cuando haya capítulos con código de R, descomentar estos dos pasos.
      # - uses: r-lib/actions/setup-r@v2
      # - uses: r-lib/actions/setup-renv@v2

      - name: Renderizar
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Sólo publica desde main; en los PRs este job no corre.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
